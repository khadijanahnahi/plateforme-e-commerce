sonar.sources=src
sonar.tests=e2e
sonar.sourceEncoding=UTF-8

sonar.exclusions=dist/**,node_modules/**,playwright-report/**,test-results/**,coverage/**,src/**/*.test.*,src/**/*.spec.*
sonar.test.inclusions=e2e/**/*.spec.js,src/**/*.test.*,src/**/*.spec.*
sonar.coverage.exclusions=src/main.jsx,src/**/*.d.ts
