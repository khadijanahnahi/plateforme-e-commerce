sonar.sources=src
sonar.tests=e2e
sonar.sourceEncoding=UTF-8

# The legacy global stylesheet exceeds the free private-organization LOC quota.
# Keep this narrow exclusion until its obsolete and duplicate rules are removed.
sonar.exclusions=dist/**,node_modules/**,playwright-report/**,test-results/**,coverage/**,src/styles.css,src/**/*.test.*,src/**/*.spec.*
sonar.test.inclusions=e2e/**/*.spec.js,src/**/*.test.*,src/**/*.spec.*
sonar.coverage.exclusions=src/main.jsx,src/**/*.d.ts
