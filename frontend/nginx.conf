limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

# Preserve HTTPS information from the public reverse proxy. When the container
# is used directly in local development, fall back to its own request scheme.
map $http_x_forwarded_proto $shopsphere_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_name _;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_backend http://backend:8080;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 105m;

    location = /api/auth/login {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass $api_backend/api/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $shopsphere_forwarded_proto;
    }

    location = /api/auth/register {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass $api_backend/api/auth/register;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $shopsphere_forwarded_proto;
    }

    location = /api/auth/forgot-password {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass $api_backend/api/auth/forgot-password;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $shopsphere_forwarded_proto;
    }

    location = /api/auth/reset-password {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass $api_backend/api/auth/reset-password;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $shopsphere_forwarded_proto;
    }

    location = /api/support-messages {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass $api_backend/api/support-messages;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $shopsphere_forwarded_proto;
    }

    location = /api/admin/notifications/stream {
        proxy_pass $api_backend/api/admin/notifications/stream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $shopsphere_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        add_header X-Accel-Buffering no;
    }

    location = /api/orders/stream {
        proxy_pass $api_backend/api/orders/stream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $shopsphere_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        add_header X-Accel-Buffering no;
    }

    location /api/ {
        proxy_pass $api_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $shopsphere_forwarded_proto;
    }

    location = /sitemap.xml {
        proxy_pass $api_backend/api/blog/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $shopsphere_forwarded_proto;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|webp|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
