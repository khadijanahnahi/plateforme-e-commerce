name: ShopSphere Full Tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shopsphere-full-tests
  cancel-in-progress: true

jobs:
  backend-integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run all backend tests
        run: mvn -B test

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start disposable ShopSphere stack
        run: |
          cp .env.example .env
          sed -i 's/^APP_AUTH_RATE_LIMIT_ENABLED=.*/APP_AUTH_RATE_LIMIT_ENABLED=false/' .env
          cat > docker-compose.e2e.yml <<'EOF'
          services:
            backend:
              ports:
                - "127.0.0.1:8080:8080"
          EOF
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build postgres minio backend

      - name: Wait for the public API
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/api/categories > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs backend
          exit 1

      - name: Run Playwright tests
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:5173
          VITE_PROXY_TARGET: http://127.0.0.1:8080
          E2E_ADMIN_EMAIL: admin@shopsphere.local
          E2E_ADMIN_PASSWORD: change-me-admin-password
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 3

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop disposable stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v
