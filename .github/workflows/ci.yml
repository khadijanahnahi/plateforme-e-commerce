name: ShopSphere CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shopsphere-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security scan
    runs-on: ubuntu-latest
    env:
      TRIVY_DISABLE_VEX_NOTICE: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java for Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Resolve backend dependencies before scan
        working-directory: backend
        run: mvn -B -q -DskipTests dependency:resolve

      - name: Scan dependencies, config and secrets with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-dirs: backend/target,frontend/dist

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run Maven tests
        run: mvn -B test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Build React app
        run: npm run build

  docker:
    name: Docker compose build
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare compose environment
        run: cp .env.example .env

      - name: Validate Docker Compose config
        run: docker compose config

      - name: Build Docker images
        run: docker compose build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start disposable ShopSphere stack
        run: |
          cp .env.example .env
          sed -i 's/^APP_AUTH_RATE_LIMIT_ENABLED=.*/APP_AUTH_RATE_LIMIT_ENABLED=false/' .env
          docker compose up -d --build postgres minio backend

      - name: Wait for the public API
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/api/categories > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs backend frontend
          exit 1

      - name: Run Playwright tests
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:5173
          VITE_PROXY_TARGET: http://127.0.0.1:8080
          E2E_ADMIN_EMAIL: admin@shopsphere.local
          E2E_ADMIN_PASSWORD: change-me-admin-password
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop disposable stack
        if: always()
        run: docker compose down -v
