apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: shopsphere
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: shopsphere
data:
  SERVER_PORT: "8080"
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ecommerce_db
  SPRING_DATASOURCE_USERNAME: ecommerce_user
  SPRING_JPA_HIBERNATE_DDL_AUTO: validate
  SPRING_JPA_SHOW_SQL: "false"
  APP_CORS_ALLOWED_ORIGINS: https://shopsphere.local:8443,https://shopsphere.local,http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174
  FRONTEND_URL: https://shopsphere.local:8443
  APP_ADMIN_ENABLED: "true"
  APP_ADMIN_FULL_NAME: ShopSphere Admin
  APP_ADMIN_EMAIL: admin@shopsphere.local
  APP_ADMIN_PHONE: "+212600000000"
  APP_EMAIL_ENABLED: "false"
  MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
  APP_EMAIL_FROM: no-reply@shopsphere.local
  APP_EMAIL_STORE_NAME: ShopSphere
  AWS_SES_SMTP_HOST: ""
  AWS_SES_SMTP_PORT: "587"
  APP_INVOICE_STORAGE_PROVIDER: minio
  APP_BLOG_STORAGE_PROVIDER: minio
  MINIO_ENDPOINT: http://minio:9000
  MINIO_BUCKET: shopsphere-invoices
  MINIO_INVOICE_PREFIX: invoices
  MINIO_BLOG_BUCKET: shopsphere-media
  APP_REFRESH_COOKIE_SECURE: "true"
  APP_REFRESH_COOKIE_SAME_SITE: Lax
  APP_WEB_PUSH_ENABLED: "false"
  JAVA_TOOL_OPTIONS: -Xms256m -Xmx512m -XX:MaxMetaspaceSize=192m -XX:+ExitOnOutOfMemoryError
