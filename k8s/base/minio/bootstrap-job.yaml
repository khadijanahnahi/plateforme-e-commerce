apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bootstrap
  namespace: shopsphere
  labels:
    app.kubernetes.io/name: minio-bootstrap
    app.kubernetes.io/part-of: shopsphere
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-bootstrap
        app.kubernetes.io/part-of: shopsphere
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: create-buckets
          image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              until mc alias set shopsphere http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                echo "MinIO indisponible, nouvelle tentative dans 3 secondes"
                sleep 3
              done
              mc mb --ignore-existing shopsphere/shopsphere-invoices
              mc mb --ignore-existing shopsphere/shopsphere-media
              mc version enable shopsphere/shopsphere-invoices
              mc version enable shopsphere/shopsphere-media
              mc admin user info shopsphere "$MINIO_ACCESS_KEY" >/dev/null 2>&1 || \
                mc admin user add shopsphere "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY"
              mc admin policy attach shopsphere readwrite --user "$MINIO_ACCESS_KEY"
              mc ls shopsphere
          env:
            - name: HOME
              value: /tmp
            - name: MC_CONFIG_DIR
              value: /tmp/mc
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_PASSWORD
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: MINIO_SECRET_KEY
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
