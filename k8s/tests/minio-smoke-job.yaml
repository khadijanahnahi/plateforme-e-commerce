apiVersion: batch/v1
kind: Job
metadata:
  name: minio-smoke-test
  namespace: shopsphere
  labels:
    app.kubernetes.io/name: minio-smoke-test
    app.kubernetes.io/part-of: shopsphere
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-smoke-test
        app.kubernetes.io/part-of: shopsphere
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: verify-object-storage
          image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              mc alias set shopsphere http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
              printf 'shopsphere-minio-smoke-test' > /tmp/source.txt
              mc cp /tmp/source.txt shopsphere/shopsphere-media/k8s-smoke/source.txt
              mc cp shopsphere/shopsphere-media/k8s-smoke/source.txt /tmp/result.txt
              test "$(cat /tmp/source.txt)" = "$(cat /tmp/result.txt)"
              mc rm --versions --force shopsphere/shopsphere-media/k8s-smoke/source.txt
              echo "MinIO smoke test successful"
          env:
            - name: HOME
              value: /tmp
            - name: MC_CONFIG_DIR
              value: /tmp/mc
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_PASSWORD
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
