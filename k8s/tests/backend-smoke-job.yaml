apiVersion: batch/v1
kind: Job
metadata:
  name: backend-smoke-test
  namespace: shopsphere
  labels:
    app.kubernetes.io/name: backend-smoke-test
    app.kubernetes.io/part-of: shopsphere
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-smoke-test
        app.kubernetes.io/part-of: shopsphere
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: verify-actuator
          image: curlimages/curl:8.12.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              curl --fail --silent --show-error http://backend:8080/actuator/health
              echo
              curl --fail --silent --show-error http://backend:8080/actuator/health/readiness
              echo
              curl --fail --silent --show-error http://backend:8080/actuator/health/liveness
              echo
              echo "Backend Actuator smoke test successful"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

