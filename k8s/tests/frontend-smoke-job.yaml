apiVersion: batch/v1
kind: Job
metadata:
  name: frontend-smoke-test
  namespace: shopsphere
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend-smoke-test
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: curl
          image: curlimages/curl:8.16.0
          command:
            - /bin/sh
            - -ec
            - |
              test "$(curl -fsS -o /dev/null -w '%{http_code}' http://frontend:8080/healthz)" = "200"
              curl -fsS http://frontend:8080/ | grep -qi '<div id="root"></div>'
              curl -fsS http://frontend:8080/api/categories >/dev/null
              echo "Frontend, SPA fallback and API proxy are healthy."
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
