apiVersion: batch/v1
kind: Job
metadata:
  name: ingress-smoke-test
  namespace: shopsphere
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingress-smoke-test
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: curl
          image: curlimages/curl:8.16.0
          command:
            - /bin/sh
            - -ec
            - |
              ingress="https://ingress-nginx-controller.ingress-nginx.svc.cluster.local"
              headers="Host: shopsphere.local"
              test "$(curl -kfsS -H "$headers" "$ingress/healthz")" = "ok"
              curl -kfsS -H "$headers" "$ingress/" | grep -qi '<div id="root"></div>'
              curl -kfsS -H "$headers" "$ingress/api/categories" >/dev/null
              echo "Ingress HTTPS, frontend and API routing are healthy."
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
