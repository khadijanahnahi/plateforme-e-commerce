spring:
  application:
    name: ecommerce
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5433/ecommerce_db}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:ecommerce_user}
    password: ${SPRING_DATASOURCE_PASSWORD:ecommerce_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  mail:
    host: ${AWS_SES_SMTP_HOST:}
    port: ${AWS_SES_SMTP_PORT:587}
    username: ${AWS_SES_SMTP_USERNAME:}
    password: ${AWS_SES_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

server:
  port: 8081

jwt:
  secret: ${JWT_SECRET:change-this-secret-key-before-production-please-use-64-characters-minimum}
  access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
  refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
  admin:
    enabled: ${APP_ADMIN_ENABLED:true}
    full-name: ${APP_ADMIN_FULL_NAME:ShopSphere Admin}
    email: ${APP_ADMIN_EMAIL:admin@shopsphere.local}
    phone: ${APP_ADMIN_PHONE:+212600000000}
    password: ${APP_ADMIN_PASSWORD:Admin@12345}
  email:
    enabled: ${APP_EMAIL_ENABLED:false}
    from: ${APP_EMAIL_FROM:no-reply@shopsphere.local}
    store-name: ${APP_EMAIL_STORE_NAME:ShopSphere}
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}
  invoice:
    storage-path: ${APP_INVOICE_STORAGE_PATH:./storage/invoices}
    storage-provider: ${APP_INVOICE_STORAGE_PROVIDER:local}
    minio-endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    minio-access-key: ${MINIO_ACCESS_KEY:minioadmin}
    minio-secret-key: ${MINIO_SECRET_KEY:minioadmin}
    minio-bucket: ${MINIO_BUCKET:shopsphere-invoices}
    minio-prefix: ${MINIO_INVOICE_PREFIX:invoices}
  rate-limit:
    auth:
      enabled: ${APP_AUTH_RATE_LIMIT_ENABLED:true}
      max-attempts: ${APP_AUTH_RATE_LIMIT_MAX_ATTEMPTS:5}
      window-seconds: ${APP_AUTH_RATE_LIMIT_WINDOW_SECONDS:60}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  product-folder: ${CLOUDINARY_PRODUCT_FOLDER:shopsphere/products}