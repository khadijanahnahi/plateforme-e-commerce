spring:
  application:
    name: ecommerce
  datasource:
    url: jdbc:postgresql://127.0.0.1:5433/ecommerce_db
    driver-class-name: org.postgresql.Driver
    username: ecommerce_user
    password: ecommerce_password
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  mail:
    host: ${AWS_SES_SMTP_HOST:}
    port: ${AWS_SES_SMTP_PORT:587}
    username: ${AWS_SES_SMTP_USERNAME:}
    password: ${AWS_SES_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

server:
  port: 8080

jwt:
  secret: change-this-secret-key-before-production-please-use-64-characters-minimum
  access-token-expiration-ms: 900000
  refresh-token-expiration-ms: 604800000

app:
  admin:
    enabled: true
    full-name: ShopSphere Admin
    email: admin@shopsphere.local
    phone: "+212600000000"
    password: Admin@12345
  email:
    enabled: ${APP_EMAIL_ENABLED:false}
    from: ${APP_EMAIL_FROM:no-reply@shopsphere.local}
    store-name: ${APP_EMAIL_STORE_NAME:ShopSphere}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  product-folder: ${CLOUDINARY_PRODUCT_FOLDER:shopsphere/products}
