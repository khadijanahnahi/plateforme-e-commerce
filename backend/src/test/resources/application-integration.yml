debug: false

spring:
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  mail:
    host: localhost
    port: 2525

app:
  admin:
    enabled: false
  email:
    enabled: false
  invoice:
    storage-provider: local
    storage-path: ./target/test-invoices

jwt:
  secret: integration-tests-only-secret-key-with-at-least-sixty-four-characters-123456
  access-token-expiration-ms: 900000
  refresh-token-expiration-ms: 604800000

logging:
  level:
    org.hibernate.SQL: WARN
    org.springframework: WARN
