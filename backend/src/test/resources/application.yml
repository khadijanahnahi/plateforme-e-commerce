spring:
  datasource:
    url: jdbc:h2:mem:ecommerce-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: never
  flyway:
    enabled: false

app:
  admin:
    enabled: false
  email:
    enabled: false
  web-push:
    enabled: false
    public-key: ""
    private-key: ""
    subject: mailto:test@shopsphere.local
    storage-encryption-key: ""
    ttl-seconds: 60
    max-attempts: 1

jwt:
  secret: tests-only-secret-key-with-at-least-sixty-four-characters-123456789
  access-token-expiration-ms: 900000
  refresh-token-expiration-ms: 604800000
