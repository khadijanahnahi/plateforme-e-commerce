spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/ecommerce_db
    driver-class-name: org.postgresql.Driver
    username: ecommerce_user
    password: ecommerce_password
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true